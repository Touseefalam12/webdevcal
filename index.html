<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - sovel problem </title>
    <link rel="stylesheet" href="style.css">
</head>      

<body>
    <h1>Calculator: kare jeevan aur calculations asaan</h1>
    <div class="maincontainer">
        <div class="row1">
            <input type="text" value="0" readonly>


        </div>
        <div class="row2">
            <input type="button" value="AC"class="btn clear">
            <input type="button" value="+/-"class="btn clear">
            <input type="button" value="%"class="btn clear">
            <input type="button" value="/"class ="btn operator">
           
        </div>
        
    
    <div class="row3">
        <input type="button" value="7"class ="btn num">
        <input type="button" value="8"class="btn num">
        <input type="button" value="9"class="btn num">
        <input type="button" value="x"class="btn operator">
    </div>
  
    <div class="row4">
        <input type="button" value="4"class="btn num">
        <input type="button" value="5"class="btn num">
        <input type="button" value="6"class="btn num">
        <input type="button" value="-"class="btn operator">
    </div>
    <div class="row5">
        <input type="button" value="1"class="btn num">
        <input type="button" value="2"class="btn num">
        <input type="button" value="3"class="btn num">
        <input type="button" value="+"class="btn operator">
    </div>
    <div class="row6">
        <input type="button" value="0"class="zerobtn num">
        <input type="button" value="."class="btn num">
        <input type="button" value="="class="btn operator">
        
    </div>
</div>
</body>

</html>
